name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip build-essential git python3-dev openjdk-17-jdk zip unzip zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
        pip install --upgrade pip
        pip install buildozer cython==0.29.36
    - name: Build with Buildozer
      run: |
        cat > buildozer.spec << 'EOL'
        [app]
        title = Duanwei
        package.name = duanwei
        package.domain = org.duanwei
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas
        version = 1.0
        requirements = python3,pygame
        orientation = landscape
        fullscreen = 1
        android.permissions = INTERNET
        android.archs = arm64-v8a
        EOL
        buildozer -v android debug
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: Duanwei-APK
        path: bin/*.apk
